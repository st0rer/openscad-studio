name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/ui/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download OpenSCAD binary (Windows)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File apps/ui/src-tauri/scripts/download-openscad-windows.ps1

      - name: Build Tauri app for Windows (release, NSIS + MSI)
        run: pnpm tauri build --bundles nsis --bundles msi
        working-directory: apps/ui

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: openscad-studio-windows
          path: |
            apps/ui/src-tauri/target/release/bundle/nsis/*.exe
            apps/ui/src-tauri/target/release/bundle/msi/*.msi

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            apps/ui/src-tauri/target/release/bundle/nsis/*.exe
            apps/ui/src-tauri/target/release/bundle/msi/*.msi